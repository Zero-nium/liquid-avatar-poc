# render.yaml
services:
  - type: web
    name: liquid-avatar
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIQUID_AVATAR_API_KEY
        sync: false
      - key: DB_PATH
        value: ./liquid_avatar.db
    runtime:
      python: "3.12"
    disk:
      name: avatar-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1