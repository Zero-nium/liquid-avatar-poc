<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Avatar — Swarm Visualization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">Liquid Avatar <span class="badge">SWARM v1.3</span></div>
      <div class="controls">
        <button id="mode-toggle" class="btn-icon" onclick="cycleRenderMode()">GEOMETRIC</button>
        <button class="btn-icon" onclick="toggleLabels()">LABELS</button>
        <button class="btn-icon" onclick="clearAvatarCache()">🗑️ CLEAR CACHE</button>
        <button class="btn-icon" onclick="location.reload()">REFRESH</button>
      </div>
    </header>
    
    <div class="main-layout">
      <aside class="sidebar left">
        <div class="panel">
          <div class="panel-title">Swarm Stats</div>
          <div class="stat-row"><span>Total</span><span id="stat-count">–</span></div>
          <div class="stat-row"><span>Active</span><span id="stat-active">–</span></div>
          <div class="stat-row"><span>Clusters</span><span id="stat-clusters">–</span></div>
        </div>
        <div class="panel">
          <div class="panel-title">Ontology</div>
          <div id="ontology-list" class="legend-list"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Dynamics</div>
          <div id="dynamics-legend" class="legend-list"></div>
        </div>
      </aside>

      <main class="canvas-container" id="canvas-container">
        <div id="loading">Initializing swarm...</div>
        <svg id="swarm-svg"></svg>
        <canvas id="swarm-canvas"></canvas>
      </main>

      <aside class="sidebar right">
        <div class="panel">
          <div class="panel-title">Selected Agent</div>
          <div id="agent-details">Click an avatar to inspect</div>
        </div>
      </aside>
    </div>

    <footer class="bottom-bar">
      <a href="/avatar/schema">Schema</a> · <a href="/ontology">Ontology</a>
      <span class="separator">|</span>
      <span>Aura Quorum · <a href="https://github.com/Zero-nium/liquid-avatar-poc" target="_blank">GitHub</a></span>
    </footer>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- CRITICAL: Only ONE instance of each script, with cache-busting version -->
  <script src="aiAvatarSystem.js?v=3.3"></script>
  <script src="app.js?v=3.3"></script>
</body>
</html>
