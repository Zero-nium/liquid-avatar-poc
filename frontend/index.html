<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liquid Avatar — Swarm Visualization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      /* PSP Medical Minimalism Palette */
      --bg-primary: #FFFFFF;
      --bg-surface: #F5F5F7;
      --bg-panel: #EEEEF0;
      --text-primary: #111111;
      --text-secondary: #666666;
      --text-muted: #999999;
      --accent: #0066FF; /* Limited use - only for critical interactions */
      --border: #DDDDDF;
      --glow: rgba(0, 102, 255, 0.1);
      
      /* Typography */
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      
      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      
      /* Borders */
      --border-radius: 0; /* Sharp edges per Designers Republic */
      --border-width: 1px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      overflow: hidden;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* ─── HEADER ───────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-lg);
      border-bottom: var(--border-width) solid var(--border);
      background: var(--bg-surface);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-weight: 600;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
    }

    .header-actions {
      display: flex;
      gap: var(--space-sm);
    }

    .btn {
      background: transparent;
      border: var(--border-width) solid var(--border);
      color: var(--text-primary);
      padding: var(--space-xs) var(--space-sm);
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      transition: all 0.1s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      background: var(--bg-panel);
      border-color: var(--text-primary);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* ─── MAIN LAYOUT ──────────────────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      gap: var(--space-md);
      padding: var(--space-md);
      overflow: hidden;
    }

    /* ─── SIDEBARS ─────────────────────────────────────────────────────── */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      background: var(--bg-surface);
      border: var(--border-width) solid var(--border);
      padding: var(--space-md);
      font-family: var(--font-mono);
      font-size: 11px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding-bottom: var(--space-sm);
      border-bottom: var(--border-width) solid var(--border);
      margin-bottom: var(--space-sm);
    }

    /* Stats Grid */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .stat-label {
      color: var(--text-secondary);
      text-transform: uppercase;
      font-size: 9px;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-weight: 600;
      font-size: 14px;
    }

    /* Ontology Legend */
    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-xs) 0;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border: var(--border-width) solid var(--border);
      flex-shrink: 0;
    }

    /* Dynamics Legend */
    .dynamics-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border: var(--border-width) solid var(--border);
      border-radius: 0;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: var(--font-mono);
    }

    .dynamics-idle { border-color: var(--text-muted); color: var(--text-muted); }
    .dynamics-input { border-color: #00AA88; color: #00AA88; }
    .dynamics-output { border-color: #FF6B35; color: #FF6B35; }
    .dynamics-analysis { border-color: var(--accent); color: var(--accent); }
    .dynamics-verification { border-color: #9333EA; color: #9333EA; }

    /* Agent Details Panel */
    .agent-details {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .agent-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .agent-meta {
      color: var(--text-secondary);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-xs) 0;
      border-bottom: var(--border-width) dashed var(--border);
      font-size: 10px;
    }

    .stat-row:last-child { border-bottom: none; }

    .stat-label { color: var(--text-secondary); }
    .stat-value { font-weight: 500; }

    /* ─── CANVAS ───────────────────────────────────────────────────────── */
    #canvas-container {
      position: relative;
      background: var(--bg-primary);
      border: var(--border-width) solid var(--border);
      overflow: hidden;
    }

    #swarm-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: var(--bg-primary);
      border: var(--border-width) solid var(--border);
      padding: var(--space-sm);
      font-family: var(--font-mono);
      font-size: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease;
      z-index: 100;
      max-width: 200px;
      box-shadow: 0 4px 12px var(--glow);
    }

    #tooltip.visible { opacity: 1; }

    .tooltip-header {
      font-weight: 600;
      margin-bottom: var(--space-xs);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Loading State */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ─── FOOTER ───────────────────────────────────────────────────────── */
    footer {
      padding: var(--space-sm) var(--space-lg);
      border-top: var(--border-width) solid var(--border);
      background: var(--bg-surface);
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-link {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .footer-link:hover { color: var(--accent); }

    /* ─── RESPONSIVE ───────────────────────────────────────────────────── */
    @media (max-width: 1200px) {
      main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      #canvas-container { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <span>Liquid Avatar</span>
    </div>
    <div style="font-family: var(--font-mono); font-size: 10px;">
      SWARM VISUALIZATION v1.2
    </div>
    <div class="header-actions">
      <button class="btn" onclick="toggleLabels()">Labels</button>
      <button class="btn" onclick="resetZoom()">Reset</button>
      <button class="btn btn-primary" onclick="refreshData()">Refresh</button>
    </div>
  </header>

  <main>
    <!-- Left Sidebar: Stats + Ontology -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-title">Swarm Stats</div>
        <div class="stat-grid">
          <div class="stat-item">
            <span class="stat-label">Total Agents</span>
            <span class="stat-value" id="stat-count">–</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Active Now</span>
            <span class="stat-value" id="stat-active">–</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Clusters</span>
            <span class="stat-value" id="stat-clusters">–</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Schema</span>
            <span class="stat-value">v1.2</span>
          </div>
        </div>
      </div>

      <div>
        <div class="sidebar-title">Ontology</div>
        <div id="ontology-list"></div>
      </div>

      <div>
        <div class="sidebar-title">Dynamics</div>
        <div id="dynamics-legend"></div>
      </div>
    </aside>

    <!-- Center: Canvas -->
    <section id="canvas-container">
      <svg id="swarm-canvas"></svg>
      <div id="loading">Initializing swarm...</div>
    </section>

    <!-- Right Sidebar: Selected Agent -->
    <aside class="sidebar">
      <div class="sidebar-title">Selected Agent</div>
      <div id="agent-details" class="agent-details">
        <div style="color: var(--text-muted); font-style: italic;">
          Click an avatar to inspect
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div>
      <a href="/avatar/schema" class="footer-link" target="_blank">Avatar Schema</a>
      ·
      <a href="/ontology" class="footer-link" target="_blank">Ontology</a>
    </div>
    <div>
      Aura Quorum / Small Council · 
      <a href="https://github.com/Zero-nium/liquid-avatar-poc" class="footer-link" target="_blank">GitHub</a>
    </div>
  </footer>

  <div id="tooltip"></div>
  <script src="app.js"></script>
</body>
</html>
