<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Avatar — Swarm Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 320px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid rgba(148, 163, 184, 0.1);
            padding: 24px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        #sidebar h1 {
            font-size: 18px;
            font-weight: 600;
            color: #22d3ee;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        #sidebar .subtitle {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .panel h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.05);
            font-size: 13px;
        }

        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #64748b; }
        .stat-value { color: #e2e8f0; font-weight: 500; }

        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #swarm-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #swarm-canvas:active { cursor: grabbing; }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.15);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .ctrl-btn:hover {
            background: rgba(34, 211, 238, 0.1);
            border-color: rgba(34, 211, 238, 0.3);
        }

        #tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 8px;
            padding: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 12px;
            max-width: 240px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        #tooltip.visible { opacity: 1; }

        .tooltip-header {
            font-weight: 600;
            color: #22d3ee;
            margin-bottom: 8px;
            font-size: 13px;
        }

        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 12px;
            padding: 16px;
            font-size: 11px;
            backdrop-filter: blur(10px);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #64748b;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(34, 211, 238, 0.2);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .dynamics-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dynamics-idle { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }
        .dynamics-input { background: rgba(34, 211, 238, 0.2); color: #22d3ee; }
        .dynamics-output { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .dynamics-analysis { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
        .dynamics-verification { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1>Liquid Avatar</h1>
            <div class="subtitle">Swarm Visualization v1.1</div>

            <div class="panel">
                <h3>Selected Agent</h3>
                <div id="agent-details">
                    <p style="color: #64748b; font-size: 13px;">Click an avatar to inspect</p>
                </div>
            </div>

            <div class="panel">
                <h3>Swarm Stats</h3>
                <div class="stat-row">
                    <span class="stat-label">Total Agents</span>
                    <span class="stat-value" id="stat-count">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Active Now</span>
                    <span class="stat-value" id="stat-active">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Clusters</span>
                    <span class="stat-value" id="stat-clusters">-</span>
                </div>
            </div>

            <div class="panel">
                <h3>Ontology</h3>
                <div id="ontology-list"></div>
            </div>

            <div class="panel">
                <h3>Dynamics</h3>
                <div id="dynamics-legend"></div>
            </div>
        </div>

        <div id="canvas-container">
            <div id="loading">
                <div class="spinner"></div>
                <div>Initializing swarm...</div>
            </div>
            <svg id="swarm-canvas"></svg>
            <div id="tooltip"></div>

            <div id="controls">
                <button class="ctrl-btn" onclick="resetZoom()">Reset View</button>
                <button class="ctrl-btn" onclick="toggleLabels()">Labels</button>
                <button class="ctrl-btn" onclick="refreshData()">Refresh</button>
            </div>

            <div id="legend">
                <div style="font-weight: 600; margin-bottom: 8px; color: #94a3b8;">Expertise</div>
                <div id="legend-content"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
