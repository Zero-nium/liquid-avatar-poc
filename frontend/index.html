<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liquid Avatar — Swarm Visualization</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@600&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a; --bg-surface: #1e293b; --text-primary: #e2e8f0; --text-secondary: #94a3b8;
      --accent: #667eea; --border: #334155; --font-mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg-surface); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .brand-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
    .header-actions { display: flex; gap: 8px; }
    .btn { background: transparent; border: 1px solid var(--border); color: var(--text-primary); padding: 4px 8px; font-family: var(--font-mono); font-size: 10px; cursor: pointer; }
    .btn:hover { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
    main { display: grid; grid-template-columns: 240px 1fr 240px; gap: 16px; padding: 16px; overflow: hidden; }
    .sidebar { background: var(--bg-surface); border: 1px solid var(--border); padding: 16px; font-family: var(--font-mono); font-size: 11px; overflow-y: auto; }
    .sidebar-title { font-weight: 600; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    #canvas-container { position: relative; background: var(--bg-primary); border: 1px solid var(--border); overflow: hidden; }
    #swarm-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; z-index: 1; cursor: grab; }
    #swarm-canvas:active { cursor: grabbing; }
    #swarm-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    #tooltip { position: fixed; background: var(--bg-surface); border: 1px solid var(--border); padding: 8px; font-family: var(--font-mono); font-size: 10px; pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 100; max-width: 200px; box-shadow: 0 4px 12px rgba(102,126,234,0.2); }
    #tooltip.visible { opacity: 1; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    footer { padding: 8px 24px; border-top: 1px solid var(--border); background: var(--bg-surface); font-family: var(--font-mono); font-size: 9px; color: var(--text-secondary); display: flex; justify-content: space-between; }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 1000px) { main { grid-template-columns: 1fr; } .sidebar { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="brand-dot"></div><span>Liquid Avatar</span></div>
    <div style="font-family:var(--font-mono);font-size:10px">SWARM v1.3</div>
    <div class="header-actions">
      <button class="btn" id="mode-toggle" onclick="cycleRenderMode()">GEOMETRIC</button>
      <button class="btn" onclick="toggleLabels()">LABELS</button>
      <button class="btn" onclick="clearAvatarCache()">🗑️ CLEAR CACHE</button>
      <button class="btn btn-primary" onclick="location.reload()">REFRESH</button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <div class="sidebar-title">Swarm Stats</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div style="color:var(--text-secondary);font-size:9px">Total</div><div id="stat-count" style="font-weight:600;font-size:14px">–</div></div>
        <div><div style="color:var(--text-secondary);font-size:9px">Active</div><div id="stat-active" style="font-weight:600;font-size:14px">–</div></div>
        <div><div style="color:var(--text-secondary);font-size:9px">Clusters</div><div id="stat-clusters" style="font-weight:600;font-size:14px">–</div></div>
      </div>
      <div class="sidebar-title" style="margin-top:16px">Ontology</div>
      <div id="ontology-list"></div>
      <div class="sidebar-title" style="margin-top:16px">Dynamics</div>
      <div id="dynamics-legend"></div>
    </aside>

    <section id="canvas-container">
      <canvas id="swarm-canvas"></canvas>
      <svg id="swarm-svg"></svg>
      <div id="loading">Initializing swarm...</div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-title">Selected Agent</div>
      <div id="agent-details" style="color:var(--text-secondary);font-style:italic">Click an avatar to inspect</div>
    </aside>
  </main>

  <footer>
    <div><a href="/avatar/schema">Schema</a> · <a href="/ontology">Ontology</a></div>
    <div>Aura Quorum · <a href="https://github.com/Zero-nium/liquid-avatar-poc">GitHub</a></div>
  </footer>

  <div id="tooltip"></div>
  
  <script src="aiAvatarSystem.js?v=3.3"></script>
  <script src="app.js?v=3.3"></script>
</body>
</html>
